<script>
const pullId = 'ex-pull';
const iso = (back) => new Date(Date.now() - back * 86400000).toISOString();

localStorage.setItem('fitnes', JSON.stringify({
  schemaVersion: 5,
  exercises: [{ id: pullId, name: 'Pull ups', note: '', usesBodyweight: true }],
  templates: [{ id: 't-1', name: 'Pull', exerciseIds: [pullId] }],
  workouts: [{
    id: 'w-1', name: 'Pull', date: iso(7),
    exercises: [{ exerciseId: pullId, sets: [
      { weightKg: null, reps: 7, band: 'green' },
      { weightKg: null, reps: 5, band: 'yellow' },
      { weightKg: null, reps: 3, band: 'bw' }
    ] }]
  }],
  bodyweightEntries: [], measurements: [], measurementEntries: [],
  draft: {
    name: 'Pull', templateId: 't-1', startedAt: iso(0),
    exercises: [{ exerciseId: pullId, sets: [
      { weightKg: null, reps: 8, band: 'green' },
      { weightKg: null, reps: 6, band: 'teal' },
      { weightKg: null, reps: null }
    ] }]
  }
}));

const frame = document.createElement('iframe');
frame.src = 'aplikacija/#/trening';
document.body.append(frame);
</script>
</body>
