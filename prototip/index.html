<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prototip – barvni gumbi</title>

  <!-- Povezava na manifest: brez tega ni namestitve -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12151a">

  <!-- iOS posebnosti: Safari za ikono in celozaslonski način ne bere manifesta -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prototip">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #12151a;
      color: #e8ecf2;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      /* safe-area: da vsebina ne konča pod zarezo oz. spodnjo črtico iPhona */
      padding: calc(env(safe-area-inset-top) + 24px) 20px
               calc(env(safe-area-inset-bottom) + 24px);
      gap: 18px;
    }

    header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
    header p  { margin: 0; font-size: 14px; color: #8b95a5; }

    .buttons { flex: 1; display: flex; flex-direction: column; gap: 16px; }

    .pad {
      flex: 1;
      min-height: 130px;
      border: none;
      border-radius: 20px;
      background: #1d222b;
      color: #6f7b8d;
      font: inherit;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .12s ease, background .35s ease, color .35s ease;
    }
    .pad:active { transform: scale(0.97); }

    .hex {
      font-size: 13px;
      font-weight: 500;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      opacity: .75;
      letter-spacing: .05em;
    }

    .reset {
      border: 1px solid #2b323d;
      background: transparent;
      color: #8b95a5;
      font: inherit;
      font-size: 14px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
    }
    .reset:active { background: #1d222b; }
  </style>
</head>
<body>

  <header>
    <h1>Prototip</h1>
    <p>Klikni gumb, da dobi naključno barvo.</p>
  </header>

  <div class="buttons">
    <button class="pad" data-button="A">
      <span class="name">Gumb A</span>
      <span class="hex">še ni barve</span>
    </button>
    <button class="pad" data-button="B">
      <span class="name">Gumb B</span>
      <span class="hex">še ni barve</span>
    </button>
  </div>

  <button class="reset">Ponastavi oba</button>

  <script>
    // Besedilo za uporabnika drži na enem mestu, da se popravi samo tu.
    const TEXT = {
      noColor: 'še ni barve'
    };

    // --- Barve -------------------------------------------------------------
    // Barvo izberemo v HSL, ker tam lahko omejimo nasičenost in svetlost
    // in tako vedno dobimo prijetno barvo (naključni RGB pogosto ni lep).
    function randomColor() {
      const h = Math.floor(Math.random() * 360);      // odtenek: cel krog
      const s = 55 + Math.floor(Math.random() * 35);  // nasičenost 55–90 %
      const l = 45 + Math.floor(Math.random() * 20);  // svetlost   45–65 %
      return { h, s, l };
    }

    function toHex({ h, s, l }) {
      const a = (s / 100) * Math.min(l / 100, 1 - l / 100);
      const channel = (n) => {
        const k = (n + h / 30) % 12;
        const value = l / 100 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
        return Math.round(255 * value).toString(16).padStart(2, '0');
      };
      return '#' + channel(0) + channel(8) + channel(4);
    }

    // --- Interakcija -------------------------------------------------------
    const buttons = document.querySelectorAll('.pad');

    function paint(button) {
      const color = randomColor();
      button.style.background = `hsl(${color.h} ${color.s}% ${color.l}%)`;
      // na svetli podlagi črna pisava, na temni bela — da je vedno berljivo
      button.style.color = color.l > 58 ? '#12151a' : '#ffffff';
      button.querySelector('.hex').textContent = toHex(color).toUpperCase();
    }

    function reset(button) {
      button.style.background = '';
      button.style.color = '';
      button.querySelector('.hex').textContent = TEXT.noColor;
    }

    buttons.forEach((button) => button.addEventListener('click', () => paint(button)));
    document.querySelector('.reset')
            .addEventListener('click', () => buttons.forEach(reset));

    // --- Service worker ----------------------------------------------------
    // Registracija uspe samo na HTTPS ali localhost. Če datoteko odpreš
    // neposredno (file://), se tiho preskoči in aplikacija vseeno dela.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
