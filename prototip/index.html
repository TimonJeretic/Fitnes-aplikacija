<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prototip – barvni gumbi</title>

  <!-- Poveze na manifest: brez tega ni namestitve -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12151a">

  <!-- iOS posebnosti: Safari ne bere manifesta za ikono in celozaslonski nacin -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prototip">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #12151a;
      color: #e8ecf2;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      /* safe-area: da vsebina ne konca pod iPhone zarezo / spodnjo crtico */
      padding: calc(env(safe-area-inset-top) + 24px) 20px
               calc(env(safe-area-inset-bottom) + 24px);
      gap: 18px;
    }

    header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
    header p  { margin: 0; font-size: 14px; color: #8b95a5; }

    .gumbi { flex: 1; display: flex; flex-direction: column; gap: 16px; }

    .pad {
      flex: 1;
      min-height: 130px;
      border: none;
      border-radius: 20px;
      background: #1d222b;
      color: #6f7b8d;
      font: inherit;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .12s ease, background .35s ease, color .35s ease;
    }
    .pad:active { transform: scale(0.97); }

    .hex {
      font-size: 13px;
      font-weight: 500;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      opacity: .75;
      letter-spacing: .05em;
    }

    .ponastavi {
      border: 1px solid #2b323d;
      background: transparent;
      color: #8b95a5;
      font: inherit;
      font-size: 14px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
    }
    .ponastavi:active { background: #1d222b; }
  </style>
</head>
<body>

  <header>
    <h1>Prototip</h1>
    <p>Klikni gumb, da dobi nakljucno barvo.</p>
  </header>

  <div class="gumbi">
    <button class="pad" data-gumb="A">
      <span class="ime">Gumb A</span>
      <span class="hex">se ni barve</span>
    </button>
    <button class="pad" data-gumb="B">
      <span class="ime">Gumb B</span>
      <span class="hex">se ni barve</span>
    </button>
  </div>

  <button class="ponastavi">Ponastavi oba</button>

  <script>
    // --- Barve -------------------------------------------------------------
    // Barvo izberemo v HSL, ker tam lahko omejimo nasicenost in svetlost
    // in tako vedno dobimo prijetno barvo (nakljucni RGB pogosto ni lep).
    function nakljucnaBarva() {
      const h = Math.floor(Math.random() * 360);   // odtenek: cel krog
      const s = 55 + Math.floor(Math.random() * 35); // nasicenost 55-90 %
      const l = 45 + Math.floor(Math.random() * 20); // svetlost   45-65 %
      return { h, s, l };
    }

    function vHex({ h, s, l }) {
      const a = (s / 100) * Math.min(l / 100, 1 - l / 100);
      const del = (n) => {
        const k = (n + h / 30) % 12;
        const barva = l / 100 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
        return Math.round(255 * barva).toString(16).padStart(2, '0');
      };
      return '#' + del(0) + del(8) + del(4);
    }

    // --- Interakcija -------------------------------------------------------
    const gumbi = document.querySelectorAll('.pad');

    function pobarvaj(gumb) {
      const barva = nakljucnaBarva();
      gumb.style.background = `hsl(${barva.h} ${barva.s}% ${barva.l}%)`;
      // na svetli podlagi crna pisava, na temni bela — da je vedno berljivo
      gumb.style.color = barva.l > 58 ? '#12151a' : '#ffffff';
      gumb.querySelector('.hex').textContent = vHex(barva).toUpperCase();
    }

    function pocisti(gumb) {
      gumb.style.background = '';
      gumb.style.color = '';
      gumb.querySelector('.hex').textContent = 'se ni barve';
    }

    gumbi.forEach((gumb) => gumb.addEventListener('click', () => pobarvaj(gumb)));
    document.querySelector('.ponastavi')
            .addEventListener('click', () => gumbi.forEach(pocisti));

    // --- Service worker ----------------------------------------------------
    // Registracija uspe samo na HTTPS ali localhost. Ce odpres datoteko
    // neposredno (file://), se tiho preskoci in aplikacija vseeno dela.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
